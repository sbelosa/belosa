name: Verify and publish shared account form correction
on:
  push:
    branches: [codex/sponsor-production-package]
    paths: ['ops-shared/**', 'release-shared/**', '.github/workflows/shared-form-update.yml']
permissions:
  contents: read
concurrency:
  group: deploy-cpanel-ftp-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate reviewed view
        run: php -l release-shared/shared-admin-form.php
      - name: Publish exact reviewed view and verify bytes
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: python3 ops-shared/final-form.py
