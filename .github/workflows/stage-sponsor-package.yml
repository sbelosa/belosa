name: Stage sponsor module for reviewed production install
on:
  push:
    branches: [codex/sponsor-production-package]
    paths: ['release-sponsor/**', 'ops-sponsor/**', '.github/workflows/stage-sponsor-package.yml']
permissions:
  contents: read
concurrency:
  group: deploy-cpanel-ftp-production
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate the private CLI installer
        run: |
          php -l release-sponsor/sponsor-release.php
          php -l release-sponsor/sponsor-root.php
          php -l release-sponsor/sponsor-research.php
          php -l release-sponsor/sponsor-final-inventory.php
          php -l release-sponsor/sponsor-gen-inventory.php
          php -l release-sponsor/sponsor-gen-links.php
          php -l release-sponsor/sponsor-gen-final.php
          php -l release-sponsor/sponsor-gen-cleanup.php
          php -l release-sponsor/sponsor-phone-inspect.php
          php -l release-sponsor/sponsor-phone-release.php
      - name: Transfer only the guarded installer outside the web root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./release-sponsor/
          server-dir: /fcc-release-20260927/
          state-name: .ftp-deploy-sync-state-sponsor-installer.json
          dangerous-clean-slate: false
      - name: Verify private installer result without publishing account data
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: python3 ops-sponsor/check.py
      - name: Retrieve private inventory using local public encryption key
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: python3 ops-sponsor/read-gen-final.py
