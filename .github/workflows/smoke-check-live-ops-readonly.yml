name: Smoke check live ops readonly

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy app and themes to cPanel
    types:
      - completed

jobs:
  smoke-check:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -n "${OPS_BASE_URL}" ] && [ -n "${FCC_OPS_READONLY_KEY}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          OPS_BASE_URL: ${{ secrets.OPS_BASE_URL }}
          FCC_OPS_READONLY_KEY: ${{ secrets.FCC_OPS_READONLY_KEY }}

      - name: Skip when secrets are missing
        if: steps.config.outputs.configured != 'true'
        run: echo "Skipping smoke check because OPS_BASE_URL or FCC_OPS_READONLY_KEY is not configured."

      - name: Smoke check health scope
        if: steps.config.outputs.configured == 'true'
        run: |
          curl --fail --silent --show-error \
            --get "${OPS_BASE_URL%/}/ops-readonly" \
            --data-urlencode "scope=health" \
            --data-urlencode "key=${FCC_OPS_READONLY_KEY}" \
            --data-urlencode "pretty=1"
        env:
          OPS_BASE_URL: ${{ secrets.OPS_BASE_URL }}
          FCC_OPS_READONLY_KEY: ${{ secrets.FCC_OPS_READONLY_KEY }}
