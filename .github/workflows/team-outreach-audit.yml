name: Read current outreach integration files privately
on:
  push:
    branches: [codex/sponsor-production-package]
    paths: ['ops-team-outreach/audit.py', 'ops-team-outreach/files.json', 'ops-team-outreach/seal.php', '.github/workflows/team-outreach-audit.yml']
permissions:
  contents: read
concurrency:
  group: deploy-cpanel-ftp-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Read production files encrypted to the local client key
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: python3 ops-team-outreach/audit.py
