# Custom code: FC-2026-08-14: Audited daily FLP360 to FCC synchronization with manual fallback
name: Sync FLP360 to FCC

on:
  push:
    branches:
      - codex/vip-flp-launch-sync-20260901
  schedule:
    # 06:17 Europe/Zagreb during CEST (05:17 during CET). GitHub cron uses UTC.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flp360-fcc-production-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate synchronization rules
        run: node scripts/test_flp360_cloud_sync.mjs

      - name: Check secure configuration
        id: config
        env:
          FLP360_USERNAME: ${{ secrets.FLP360_USERNAME }}
          FLP360_PASSWORD: ${{ secrets.FLP360_PASSWORD }}
          FCC_FOREVER_SYNC_URL: ${{ secrets.FCC_FOREVER_SYNC_URL }}
          FCC_FOREVER_SYNC_KEY: ${{ secrets.FCC_FOREVER_SYNC_KEY }}
        run: |
          configured=true
          for name in FLP360_USERNAME FLP360_PASSWORD FCC_FOREVER_SYNC_URL FCC_FOREVER_SYNC_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Secure cloud synchronization is waiting for: ${name}"
              configured=false
            fi
          done
          echo "configured=${configured}" >> "$GITHUB_OUTPUT"
          if [ "$configured" != "true" ]; then
            echo "Required synchronization secrets are missing; failing visibly instead of reporting a false green run."
            exit 1
          fi

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Synchronize verified FLP360 reports
        env:
          FLP360_USERNAME: ${{ secrets.FLP360_USERNAME }}
          FLP360_PASSWORD: ${{ secrets.FLP360_PASSWORD }}
          FCC_FOREVER_SYNC_URL: ${{ secrets.FCC_FOREVER_SYNC_URL }}
          FCC_FOREVER_SYNC_KEY: ${{ secrets.FCC_FOREVER_SYNC_KEY }}
        run: node scripts/flp360_cloud_sync.mjs

# /Custom code: FC-2026-08-14
