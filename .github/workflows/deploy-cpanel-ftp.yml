name: Deploy app and themes to cPanel

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'themes/**'
      - '.github/workflows/deploy-cpanel-ftp.yml'
  workflow_dispatch:
    inputs:
      previous_main_sha:
        description: Currently deployed commit used to stage newly added dependencies
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-cpanel-ftp-production
  cancel-in-progress: false

jobs:
  deploy:
    # Custom code: FC-2026-10-07: This reviewed registration release deploys only its live patches.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[fcc-registration-targeted]')
    # /Custom code: FC-2026-10-07
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      click-test-db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: local-click-test-only
          MARIADB_DATABASE: click_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Custom code: FC-2026-10-12: the previous main commit tells which helper files are new.
          fetch-depth: 0

      - name: Use PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # Custom code: FC-2026-09-14: Render the real registration CAPTCHA in release tests
          extensions: gd, mbstring, mysqli
          # /Custom code: FC-2026-09-14
          coverage: none

      - name: Lint deployed PHP files
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' -t php_files < <(find app themes -type f -name '*.php' -print0)
          if [[ "${#php_files[@]}" -eq 0 ]]; then
            echo 'No PHP files were found in app/ or themes/.' >&2
            exit 1
          fi

          for php_file in "${php_files[@]}"; do
            php -l "${php_file}" > /dev/null
          done

          echo "PHP lint passed for ${#php_files[@]} deployed files."

      - name: Run deterministic release guards
        shell: bash
        run: |
          set -euo pipefail

          php scripts/test_authentication_stripe_restore_guard.php
          php scripts/test_billing_recovery_guard.php
          php scripts/test_account_plan.php
          # Custom code: FC-2026-09-14: Verify registration rejection and success paths before publishing
          php scripts/test_registration_security.php
          # /Custom code: FC-2026-09-14
          php scripts/test_brevo_mail_fallback.php
          php scripts/test_forever_business_import.php
          php scripts/test_los_forever_admin_guards.php
          php scripts/test_ops_readonly_secret_redaction.php
          php scripts/test_public_biolink_js_guards.php
          php scripts/test_request_performance_guards.php
          php scripts/test_user_plan_expiration_guard.php
          php scripts/test_vip_funnel_persistence_guards.php
          # Custom code: FC-2026-10-11: CC-based public visibility and 4CC group rules
          php scripts/test_cc_visibility.php
          php scripts/test_invite_content_migration.php
          # /Custom code: FC-2026-10-11
          # Custom code: FC-2026-10-12: Moj put tracks, known steps, neutral copy and sponsor notices
          php scripts/test_journey_tracks.php
          # New FCC card: styles, PRO gating, core blocks and block guide
          php scripts/test_fcc_card.php
          php scripts/test_fcc_card_editor.php
          php scripts/test_fcc_release_fixes.php
          php scripts/test_fcc_editor_transaction.php
          php scripts/test_fcc_classic_aloe.php
          php scripts/test_fcc_aloe_provenance.php
          # /Custom code: FC-2026-10-12

      - name: Verify immutable Forever click qualification
        env:
          FCC_TEST_DB_HOST: 127.0.0.1
          FCC_TEST_DB_PASSWORD: local-click-test-only
        run: php scripts/test_forever_click_qualification.php

      # FTP is not an atomic directory switch. Install backward-compatible helpers
      # before controllers begin reading the immutable qualification columns.
      - name: Prepare click qualification prerequisites
        run: |
          mkdir -p click-prerequisites/link click-prerequisites/tracking
          cp app/helpers/Link.php click-prerequisites/link/
          cp app/helpers/automations.php click-prerequisites/tracking/

      - name: Deploy click destination helpers
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_TLS_SERVER || 'litespeed.hiperweb.hr' }}
          protocol: ftps
          security: strict
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./click-prerequisites/link/
          server-dir: /public_html/app/helpers/
          state-name: .ftp-deploy-sync-state-click-link.json
          dangerous-clean-slate: false

      - name: Deploy click tracking and schema helpers
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_TLS_SERVER || 'litespeed.hiperweb.hr' }}
          protocol: ftps
          security: strict
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./click-prerequisites/tracking/
          server-dir: /public_html/app/helpers/
          state-name: .ftp-deploy-sync-state-click-tracking.json
          dangerous-clean-slate: false

      # Custom code: FC-2026-10-12: FTP is not atomic. Helper files that are new in this push are
      # unknown to the running app/init.php, so they can arrive first; the new app/init.php then loads
      # them before the controllers, changed helpers and themes that call them are uploaded. Each run
      # keeps its own state files, so a later run never treats these files as removed.
      - name: Prepare new helpers and app/init.php
        env:
          BEFORE_SHA: ${{ github.event.before || inputs.previous_main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-prerequisites/helpers release-prerequisites/init release-prerequisites/app release-prerequisites/themes release-prerequisites/views/altum/views/partner
          if [ -n "${BEFORE_SHA}" ] && ! [[ "${BEFORE_SHA}" =~ ^0+$ ]] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git diff --name-only --diff-filter=A "${BEFORE_SHA}" HEAD -- app/helpers > release-prerequisites/new-helpers.txt
          else
            echo 'A valid currently deployed commit is required before FTP changes.' >&2
            exit 1
          fi
          git diff --name-only --diff-filter=A "${BEFORE_SHA}" HEAD -- app/config app/controllers themes > release-prerequisites/new-dependencies.txt
          while read -r dependency; do
            case "${dependency}" in
              app/config/*|app/controllers/*) target="release-prerequisites/app/${dependency#app/}" ;;
              themes/*) target="release-prerequisites/themes/${dependency#themes/}" ;;
              *) continue ;;
            esac
            mkdir -p "$(dirname "${target}")"
            cp "${dependency}" "${target}"
          done < release-prerequisites/new-dependencies.txt
          while read -r helper; do
            case "${helper}" in
              *.php) if [ -f "${helper}" ]; then cp "${helper}" release-prerequisites/helpers/; fi ;;
            esac
          done < release-prerequisites/new-helpers.txt
          cp app/init.php release-prerequisites/init/
          cp themes/altum/views/partner/journey.php themes/altum/views/partner/journey-pilot.php release-prerequisites/views/altum/views/partner/
          echo "Sent before app/init.php:"
          ls -1 release-prerequisites/helpers

      - name: Deploy new app dependencies before controllers
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_TLS_SERVER || 'litespeed.hiperweb.hr' }}
          protocol: ftps
          security: strict
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./release-prerequisites/app/
          server-dir: /public_html/app/
          state-name: .ftp-deploy-sync-state-release-app-${{ github.run_id }}-${{ github.run_attempt }}.json
          dangerous-clean-slate: false

      - name: Deploy new themes dependencies before controllers
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_TLS_SERVER || 'litespeed.hiperweb.hr' }}
          protocol: ftps
          security: strict
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./release-prerequisites/themes/
          server-dir: /public_html/themes/
          state-name: .ftp-deploy-sync-state-release-themes-${{ github.run_id }}-${{ github.run_attempt }}.json
          dangerous-clean-slate: false

      - name: Deploy new helpers before app/init.php
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_TLS_SERVER || 'litespeed.hiperweb.hr' }}
          protocol: ftps
          security: strict
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./release-prerequisites/helpers/
          server-dir: /public_html/app/helpers/
          state-name: .ftp-deploy-sync-state-release-helpers-${{ github.run_id }}-${{ github.run_attempt }}.json
          dangerous-clean-slate: false

      - name: Deploy app/init.php before controllers
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_TLS_SERVER || 'litespeed.hiperweb.hr' }}
          protocol: ftps
          security: strict
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./release-prerequisites/init/
          server-dir: /public_html/app/
          state-name: .ftp-deploy-sync-state-release-init-${{ github.run_id }}-${{ github.run_attempt }}.json
          dangerous-clean-slate: false
      - name: Deploy compatible journey views before changed helpers
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_TLS_SERVER || 'litespeed.hiperweb.hr' }}
          protocol: ftps
          security: strict
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./release-prerequisites/views/
          server-dir: /public_html/themes/
          state-name: .ftp-deploy-sync-state-release-views-${{ github.run_id }}-${{ github.run_attempt }}.json
          dangerous-clean-slate: false
      # /Custom code: FC-2026-10-12

      - name: Deploy app/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_TLS_SERVER || 'litespeed.hiperweb.hr' }}
          protocol: ftps
          security: strict
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./app/
          server-dir: /public_html/app/
          dangerous-clean-slate: false
          # Custom code: FC-2026-10-12: excluded files are neither uploaded nor deleted. GeoLite databases
          # are refreshed by their own workflow, language caches are generated on the server from the newer
          # sources, and the deployment marker stays current until the separate marker step replaces it.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/*.mmdb
            languages/cache/**
            config/deployment.php

      - name: Deploy themes/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_TLS_SERVER || 'litespeed.hiperweb.hr' }}
          protocol: ftps
          security: strict
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./themes/
          server-dir: /public_html/themes/
          dangerous-clean-slate: false

      - name: Verify Forever Business runtime
        env:
          FCC_FOREVER_SYNC_URL: ${{ secrets.FCC_FOREVER_SYNC_URL }}
          FCC_FOREVER_SYNC_KEY: ${{ secrets.FCC_FOREVER_SYNC_KEY }}
        run: |
          : "${FCC_FOREVER_SYNC_URL:?FCC_FOREVER_SYNC_URL is not configured}"
          : "${FCC_FOREVER_SYNC_KEY:?FCC_FOREVER_SYNC_KEY is not configured}"

          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT

          curl --fail --silent --show-error \
            --max-time 30 \
            --request POST "${FCC_FOREVER_SYNC_URL}" \
            --header "X-FCC-Forever-Sync-Key: ${FCC_FOREVER_SYNC_KEY}" \
            --data-urlencode "metric=status" \
            --output "${response_file}"

          jq -e '
            .status == "success"
            and .metric == "status"
            and (.period | type == "string")
            and (.summary | type == "object")
          ' "${response_file}"
          jq '{status, metric, period, last_sync_at}' "${response_file}"

      - name: Generate verified deployment marker
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p deployment-marker
          php <<'PHP'
          <?php
          $github_sha = getenv('GITHUB_SHA');
          $github_run_id = getenv('GITHUB_RUN_ID');

          if(!is_string($github_sha) || preg_match('/\A[0-9a-f]{40}\z/', $github_sha) !== 1) {
              fwrite(STDERR, "GITHUB_SHA is invalid.\n");
              exit(1);
          }

          if(!is_string($github_run_id) || preg_match('/\A[1-9][0-9]{0,19}\z/', $github_run_id) !== 1) {
              fwrite(STDERR, "GITHUB_RUN_ID is invalid.\n");
              exit(1);
          }

          $marker = [
              'github_sha' => $github_sha,
              'github_run_id' => $github_run_id,
              'deployed_at' => gmdate('Y-m-d\TH:i:s\Z'),
          ];
          $contents = sprintf(
              "<?php\n\nreturn [\n    'github_sha' => '%s',\n    'github_run_id' => '%s',\n    'deployed_at' => '%s',\n];\n",
              $marker['github_sha'],
              $marker['github_run_id'],
              $marker['deployed_at']
          );

          if(file_put_contents('deployment-marker/deployment.php', $contents) === false) {
              fwrite(STDERR, "Could not write the deployment marker.\n");
              exit(1);
          }
          PHP

          php -l deployment-marker/deployment.php

      - name: Publish verified deployment marker
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_TLS_SERVER || 'litespeed.hiperweb.hr' }}
          protocol: ftps
          security: strict
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./deployment-marker/
          server-dir: /public_html/app/config/
          state-name: .ftp-deploy-sync-state-deployment-marker.json
          dangerous-clean-slate: false
