name: Publish reviewed PRO team access and upgrade experience
on:
  push:
    branches: [codex/sponsor-production-package]
    paths: ['ops-pro-sync/pro-access.py', 'ops-pro-sync/pro-access-manifest.json', 'release-pro-access/**', '.github/workflows/pro-access-publish.yml']
permissions:
  contents: read
concurrency:
  group: deploy-cpanel-ftp-production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Validate, back up, publish and verify only reviewed changes
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: python3 ops-pro-sync/pro-access.py
